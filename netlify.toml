# The site lives in the "Welcome page only" folder. This root config points builds there
# so they work whether they start from the repository root or from that folder.
[build]
  base = "Welcome page only"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM_EMAIL,SMTP_FROM_NAME,NOTIFY_TO,DATABASE_URL,SITE_URL"

[functions]
  included_files = ["public/images/email-logo.png"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
